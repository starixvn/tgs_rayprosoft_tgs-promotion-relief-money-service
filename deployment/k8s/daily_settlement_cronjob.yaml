apiVersion: batch/v1
kind: CronJob
metadata:
  name: promotion-rebate-settlement-scheduler
spec:
  schedule: "30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: promotion-rebate-settlement-job
              image: alpine/curl:3.14
              imagePullPolicy: IfNotPresent
              command:
                - curl
                - -X
                - POST
                - http://tgs-promotion-rebate/schedule/settle
          restartPolicy: OnFailure
