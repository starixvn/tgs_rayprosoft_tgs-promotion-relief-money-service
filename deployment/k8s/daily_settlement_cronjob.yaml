apiVersion: batch/v1
kind: CronJob
metadata:
  name: promotion-relief-settlement-scheduler
spec:
  schedule: "30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: promotion-relief-settlement-job
              image: alpine/curl:3.14
              imagePullPolicy: IfNotPresent
              command:
                - curl
                - -X
                - POST
                - http://promotion-relief-money-service/schedule/settle
          restartPolicy: OnFailure
