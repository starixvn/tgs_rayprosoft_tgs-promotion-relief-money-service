apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "promotion-relief-money-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "Promotion": {
        "Url": "http://promotion-api"
      }
    }
  monitor.settings.json: |
    {
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }

